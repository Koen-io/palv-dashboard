<!doctype html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src *; child-src *; object-src *; img-src 'self' data: https: palvtile:; connect-src 'self' https://api.rainviewer.com; media-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>P-ALV Dashboard</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="system.css">
  <link rel="stylesheet" href="plan/plan.css">
  <link rel="stylesheet" href="timings.css">
  <link rel="stylesheet" href="mission.css">
  <link rel="stylesheet" href="whiteboard.css">
  <link rel="stylesheet" href="offshore.css">
  <link rel="stylesheet" href="touch.css">
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <div class="tb-brand">
        <img src="../../assets/logo.png" alt="">
        <span>P-ALV Dashboard</span><span id="tb-version"></span>
      </div>
      <div class="tb-spacer"></div>
      <div class="tb-actions" id="tb-actions"></div>
      <div class="tb-window" id="tb-window"></div>
    </div>

    <header id="header">
      <div class="hd-left">
        <div class="hd-part" data-part="brand">
          <div class="hd-brand">
            <img class="hd-logo" src="../../assets/logo.png" alt="Police Air Support Unit">
            <div class="hd-name">P-ALV <span>DASHBOARD</span></div>
            <div class="hd-title">
              <div class="hd-sub">POLICE AIR SUPPORT UNIT</div>
              <div class="hd-motto">OPERAM SUPER OMNIA</div>
            </div>
          </div>
        </div>
        <div class="hd-part" data-part="clocks"><div class="hd-clocks" id="clocks"></div></div>
      </div>
      <div class="hd-time">
        <div class="hd-part" data-part="sun"><div class="hd-udp" id="udp" aria-label="Uniforme daglichtperiode"></div></div>
        <div class="hd-part" data-part="moon"><div class="hd-udp hd-moon" id="moon" aria-label="Maan: fase, stand en lichtniveau"></div></div>
      </div>
      <div class="hd-part hd-part-eham" data-part="metar"><section class="hd-eham" id="eham" aria-label="Luchtvaartweer van de basis en de Noordzee"></section></div>
    </header>
    <div id="hd-tune-bar" hidden></div>

    <nav id="page-bar" aria-label="Pagina's"><div id="page-tabs" role="tablist"></div><div class="pb-spacer"></div><div id="health" role="alert" hidden></div><button id="mute-flag" type="button" title="Het dashboard is gedempt. Tik om het geluid weer aan te zetten." hidden></button><div id="workplace"></div></nav>

    <div id="emergency" role="alert" hidden></div>

    <main id="canvas"></main>

    <div id="edit-bar" hidden></div>
  </div>
  <div id="oled-veil" aria-hidden="true"></div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="../bases.js"></script>
  <script src="suntable.js"></script>

  <script src="widgets/metar.js"></script>
  <script src="widgets/runway.js"></script>
  <script src="vendor/places-nl.js"></script>
  <script src="places.js"></script>

  <script src="plan/geo.js"></script>

  <script src="app.js"></script>
